<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="100%" stop-color="#0B0908" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Maritime Compass Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#292524" stroke-width="6" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="176" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" />

  <!-- Compass Cardinal Ticks -->
  <line x1="256" y1="48" x2="256" y2="76" stroke="#E11D48" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="436" x2="256" y2="464" stroke="#78716C" stroke-width="5" stroke-linecap="round" />
  <line x1="48" y1="256" x2="76" y2="256" stroke="#78716C" stroke-width="5" stroke-linecap="round" />
  <line x1="436" y1="256" x2="464" y2="256" stroke="#78716C" stroke-width="5" stroke-linecap="round" />

  <!-- Stylized Angling Hook & Wave Geometry -->
  <!-- Subtle Tidal Flow Curves -->
  <path d="M128 320 Q 192 288, 256 320 T 384 320" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="8" stroke-linecap="round" />
  <path d="M148 356 Q 202 332, 256 356 T 364 356" fill="none" stroke="rgba(255, 255, 255, 0.10)" stroke-width="6" stroke-linecap="round" />

  <!-- Bold Hook Emblem in Crimson Gradient -->
  <!-- Hook eye -->
  <circle cx="256" cy="140" r="28" fill="none" stroke="url(#accentGrad)" stroke-width="16" />
  <!-- Hook shank -->
  <line x1="256" y1="168" x2="256" y2="284" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round" />
  <!-- Hook bend & barb -->
  <path d="M256 280 C 256 360, 350 360, 350 286 L 350 240 L 324 256" fill="none" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Maritime Compass Star Point -->
  <polygon points="256,190 268,220 298,220 274,238 283,266 256,248 229,266 238,238 214,220 244,220" fill="#FFFFFF" opacity="0.9" />

  <!-- Brand Signature Dot -->
  <circle cx="256" cy="140" r="10" fill="#E11D48" />
</svg>
